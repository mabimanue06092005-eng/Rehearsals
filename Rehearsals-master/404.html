<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page not found — Rehearsals</title>
<meta name="robots" content="noindex">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #030304;
    color: #f2f1ed;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 420px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: #f97316;
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: clamp(30px, 6vw, 40px);
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 15px; line-height: 1.6;
    color: #b8b8c4;
    margin: 0 0 30px;
  }
  a.home-link {
    display: inline-block;
    padding: 13px 28px;
    background: linear-gradient(135deg, #fdba74, #f97316);
    color: #1a0f00;
    font-weight: 700; font-size: 15px;
    text-decoration: none;
    border-radius: 8px;
    box-shadow: 0 8px 24px -6px rgba(249,115,22,0.5);
  }
  a.home-link:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">404</div>
    <h1>This page didn't go as rehearsed.</h1>
    <p>Whatever you were looking for isn't here. Head back and pick up where you left off.</p>
    <a class="home-link" href="/">Back to Rehearsals</a>
  </div>
</body>
</html>
